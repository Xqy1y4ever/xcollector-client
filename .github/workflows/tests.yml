name: Self-checks

# 只跑**离线**自检：源库读取、相对时间解析、地点提取、抽取、镜像状态机、Web UI、
# 解密导出。都不联网、不需要后端，所以可以在 CI 里稳定地跑。
#
# 端到端那个（tests/check_pipeline_e2e.py）需要先起一个后端，所以没放这里 ——
# 部署/发版前请在本机按 README 的「自检」一节跑一遍。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 放在最前面：它扫的是"执行到才会炸"的那类错误（改名漏改调用处、
      # except 写了个没导入的异常类），其他测试通常跑不到那些分支。
      # 现实中已经出现过两次，都是用户在日志里发现的。
      - name: 静态：用了但没定义的名字
        run: python -m tests.check_static

      # 这两个文件和 xcollector-bot 里的同名文件是**逐字复制**的关系。
      # 在 CI 里跑它们，就是为了在两边漂移时立刻红。
      - name: 相对时间解析（与 bot 共用同一套用例）
        run: python -m tests.check_timeparse

      # 抽取层：提示词里的日历、判定门槛、以及"模型没算出时间就用规则补"。
      # 最后一节会**真的走一遍「拼提示词 → 调模型 → 合并规则」**（只把网络层换成假的）：
      # 曾经这里漏改过一个函数名，导致每次模型调用都 NameError、被上层吞成
      # "降级为规则抽取"，而当时所有自检都是绿的。这条必须留在 CI 里。
      - name: 抽取（判据门槛 / 相对时间日历 / LLM 那条路）
        run: python -m tests.check_extract

      # 重判历史通知那个工具（默认干跑）：确定性判据先过、干跑不写、--apply 才归档。
      - name: 重判工具（清理历史误报）
        run: python -m tests.check_rejudge

      - name: 地点提取（与 bot 共用同一套用例）
        run: python -m tests.check_location

      - name: 源库读取器
        run: python -m tests.check_source_db

      - name: 镜像库状态机（判据是"读没读过"）
        run: python -m tests.check_mirror

      - name: 白名单（只收窄、号码校验、改了立刻生效）
        run: python -m tests.check_whitelist

      - name: 配置三方对账（字段 ↔ 环境变量 ↔ 代码）
        run: python -m tests.check_config

      # 这套自检是"解密 + 导出"能不能信的根据：
      #   1) 用本仓库自己的 PageCodec 把一份真 SQLite 库按 SQLCipher 格式加密，
      #      再解密回来逐页比对字节；
      #   2) 密钥错 / 密文被改 / IV 被改 / 页被换序 / 源库缺尾，都必须**当场失败**，
      #      而不是给出一份"看起来正常"的乱码库。
      # 它不需要网络，也不需要 sqlcipher3。
      - name: nt_msg.db 解密与导出（SQLCipher 页格式 / wire / 导出）
        run: python -m tests.check_ntmsg_db

      # Web UI 是**唯一会写用户 .env 的东西**：这里验的就是"只改配置项那几行"、
      # "密钥不回显"、"不带 X-XC-UI 的 POST 一律 403"。真起一个服务（随机端口），
      # 但仍然不联网、不需要后端。
      - name: 本地 Web UI（.env 读写 + HTTP 接口）
        run: python -m tests.check_webui
